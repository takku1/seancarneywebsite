# Build gate: types, unit tests, build, dependency audit, and the AuditForge-style secret/PII scan.
name: ci
# Manual only (Actions tab > ci > Run workflow): Actions minutes are shared across the
# account's private repos. The release gate is local: scripts/publish.sh / npm run verify.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      # Pinned to commit SHAs (tags can be moved); Dependabot keeps these current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx astro check
      - run: npm test
      - run: npx astro build
      - run: npm audit --omit=dev --audit-level=high
